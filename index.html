<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #333;
    }

    header {
      background: #ff7043;
      padding: 15px;
      text-align: center;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .search-container {
      display: flex;
      justify-content: center;
      margin: 20px;
    }

    #searchInput {
      padding: 10px;
      width: 300px;
      border: 2px solid #ff7043;
      border-radius: 5px;
      outline: none;
    }

    #searchBtn, #randomBtn {
      padding: 10px 15px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background: #ff7043;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    #searchBtn:hover, #randomBtn:hover {
      background: #e64a19;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
      text-align: center;
    }

    .card-body h3 {
      margin: 10px 0;
      font-size: 1.2rem;
    }

    .card-body a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #ff7043;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }

    .card-body a:hover {
      background: #e64a19;
    }
  </style>
</head>
<body>

  <header>🍽️ Recipe Finder App</header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search recipe (e.g., chicken)">
    <button id="searchBtn">Search</button>
    <button id="randomBtn">Random Recipe</button>
  </div>

  <div class="results" id="results"></div>

  <script>
    const searchBtn = document.getElementById("searchBtn");
    const randomBtn = document.getElementById("randomBtn");
    const searchInput = document.getElementById("searchInput");
    const results = document.getElementById("results");

    // Search Recipes
    searchBtn.addEventListener("click", () => {
      const query = searchInput.value.trim();
      if (query) {
        fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${query}`)
          .then(res => res.json())
          .then(data => displayRecipes(data.meals))
          .catch(() => results.innerHTML = "<p>❌ No recipes found!</p>");
      }
    });

    // Random Recipe
    randomBtn.addEventListener("click", () => {
      fetch("https://www.themealdb.com/api/json/v1/1/random.php")
        .then(res => res.json())
        .then(data => displayRecipes(data.meals));
    });

    // Display Recipes
    function displayRecipes(meals) {
      results.innerHTML = "";
      if (!meals) {
        results.innerHTML = "<p>❌ No recipes found!</p>";
        return;
      }
      meals.forEach(meal => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `
          <img src="${meal.strMealThumb}" alt="${meal.strMeal}">
          <div class="card-body">
            <h3>${meal.strMeal}</h3>
            <a href="${meal.strYoutube}" target="_blank">📺 Watch Recipe</a>
          </div>
        `;
        results.appendChild(card);
      });
    }
  </script>

</body>
</html>
